<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">AI 出题精灵 · 八步</title>
  <desc id="logo-desc">八道刻度对应八步流程；缺口处的一笔朱砂，是此刻正在落笔的位置。</desc>
  <style>
    .ink { fill: var(--logo-ink, #1B1711); }
    .accent { fill: var(--logo-accent, #A63D2F); }
    .cut { fill: var(--logo-cut, #F3EEE3); }
    .surface { fill: var(--logo-surface, #F3EEE3); }
    .ink-line { fill: none; stroke: var(--logo-ink, #1B1711); stroke-linecap: round; stroke-linejoin: round; }
    .accent-line { fill: none; stroke: var(--logo-accent, #A63D2F); stroke-linecap: round; stroke-linejoin: round; }
    .cut-line { fill: none; stroke: var(--logo-cut, #F3EEE3); stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g>
    <path d="M61.6 18.1A34 34 0 1 1 38.4 18.1" fill="none" stroke="var(--logo-ink, #1B1711)" stroke-width="2.4" opacity=".22"/>
    <g stroke="var(--logo-ink, #1B1711)" stroke-width="4.6" stroke-linecap="round" opacity=".30">
    <line x1="50" y1="24" x2="50" y2="31" transform="rotate(45 50 50)"/>
    <line x1="50" y1="24" x2="50" y2="31" transform="rotate(90 50 50)"/>
    <line x1="50" y1="24" x2="50" y2="31" transform="rotate(135 50 50)"/>
    <line x1="50" y1="24" x2="50" y2="31" transform="rotate(180 50 50)"/>
    <line x1="50" y1="24" x2="50" y2="31" transform="rotate(225 50 50)"/>
    <line x1="50" y1="24" x2="50" y2="31" transform="rotate(270 50 50)"/>
    <line x1="50" y1="24" x2="50" y2="31" transform="rotate(315 50 50)"/>
    </g>
    <line x1="50" y1="21" x2="50" y2="36" stroke="var(--logo-accent, #A63D2F)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="5" class="ink"/>
  </g>
</svg>
