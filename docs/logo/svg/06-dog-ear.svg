    <path d="M56 33H72" fill="none" stroke="var(--logo-ink, #1B1711)" stroke-width="1.6" opacity=".45"/>
    <path d="M36 49H64M36 59H58" class="ink-line" stroke-width="2.6" opacity=".42"/>
    <path d="M36 69H49" class="accent-line" stroke-width="3.2"/>
