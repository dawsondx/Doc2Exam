[project]
name = "ai-quiz-backend"
version = "1.1.0"
description = "AI出题精灵 - 把制度文档转换为可追溯可复核的试题"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.0,<0.142",
    "uvicorn>=0.38.0",
    "sqlalchemy>=2.0.52,<2.1",
    "pydantic>=2.13.0,<2.14",
    "alembic>=1.16.0",
    "pypdfium2>=5.13.0,<5.14",
    "python-docx>=1.2.0,<1.3",
    "openai>=3.3.0,<3.4",
    "tiktoken>=0.14.0,<0.15",
    "keyring>=25.7.0,<26",
    "docxtpl==0.20.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "reportlab>=5.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions", "scripts/benchmarks.py", "scripts/probe_stacks.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
